<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DUO LAB Fisioterapia</title>
<meta name="description" content="Agende sua sessão na DUO LAB Fisioterapia. Veja os horários livres dos fisioterapeutas.">
<style>
:root{--bg:#0a0a0a;--tx:#f2f2f0;--mu:#a0a09a;--pr:#fed600;--ink:#0a0a0a}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;align-items:center;justify-content:center;padding:24px 16px;padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
main{width:100%;max-width:420px;text-align:center}
img{width:min(240px,64vw);height:auto;margin:0 auto 28px;display:block}
h1{font-size:26px;line-height:1.2;margin:0 0 10px}
p{margin:0 0 24px;color:var(--mu)}
a.b{display:block;background:var(--pr);color:var(--ink);font-weight:700;font-size:18px;text-decoration:none;border-radius:14px;padding:16px 20px}
a.b:focus-visible{outline:3px solid #fff;outline-offset:3px}
small{display:block;margin-top:18px;color:var(--mu);font-size:13px}
</style>
</head>
<body>
<main>
<img src="img/logo-claro-curto.png" alt="DUO LAB Fisioterapia">
<h1>Agende sua sessão</h1>
<p>Veja os horários livres dos nossos fisioterapeutas e faça o seu pedido.</p>
<a class="b" href="https://claude.ai/artifact/HTAwhSyUQgSxfgRgaY1q5n">Ver horários</a>
<small>Seu pedido é confirmado pelo fisioterapeuta.</small>
</main>
</body>
</html>
